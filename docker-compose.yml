services:
  postgres:
    image: postgres:18-alpine
    container_name: business-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_saas
      POSTGRES_USER: business
      POSTGRES_PASSWORD: business_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d business_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: business-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
